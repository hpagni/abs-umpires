# quality/steps.yml -- the step registry. SOP section 0.1.
#
# Owner: SOP step W9.1, fleet phase 01.
#
# Every piece of work in this project has a step id of the form W<workstream>.<number>.
# Ids are stable. A retired step keeps its id, is marked retired with a date and a
# reason, and is never reused.
#
# A step is not done until `make prove` says so. `scripts/prove.sh <step-id>` runs the
# verify command registered here and writes a receipt to quality/receipts/<step-id>.json.
# `make prove` runs every registered step and prints one line each: PASS, FAIL, MISSING
# or RETIRED. It exits non-zero if any non-retired registered step is FAIL.
#
# FIELDS
#   id          W<workstream>.<number>. Unique. Required.
#   title       One line, no trailing period. Required for a live step.
#   verify      The shell command prove.sh runs, from the repository root. Required
#               for a live step. Absent on a retired step.
#   expect_exit The exit code that counts as PASS. 0 for every step in this registry.
#   owner       The owning workstream, W1 W2 W3 W6 W7 W9. Must match the id.
#   needs       Optional, comma-separated paths. If any is absent, or is still one of the
#               stubs W1.14 wrote (they open a comment line with the placeholder marker),
#               the step is reported MISSING and its verify command is not run. This is how
#               `make prove` distinguishes "not built yet" from "built and failing".
#   pending_owner
#               Optional, one line of prose. The step is parked on a move only the owner can
#               make, and the line says which move. `make prove` prints PENDING-OWNER and the
#               line, does not run the verify command, and does not count the step as failed
#               or as missing. Use it only when the build side is finished: MISSING still
#               means nobody has built the thing yet.
#   retired     true on a retired id. Pairs with reason and date.
#   reason      Why the id was retired.
#   date        Madrid-stamped date of the retirement, YYYY-MM-DD.
#
# PARSER. yq is not installed on this machine and phase 01 adds no dependency for one
# line, so quality/write_receipt.py reads this file with a strict reader that accepts a
# deliberately small YAML subset: a top-level sequence of flat mappings, one `- key: value`
# opener per record, two-space `key: value` continuations, comments on their own line, and
# scalars that are bare, 'single-quoted' or "double-quoted". Nested structures, block
# scalars and inline lists are rejected with an error naming the line. Keep this file
# inside that subset.
#
# REGISTRATION IS THE POINT. A test file that no verify command names is a test that
# `make prove` never runs, and the round-2 verifier found exactly that: two finished
# tools and five new test modules sitting in the tree, red or green, with no gate
# watching either way. When a fixer adds a test, it is added to the owning step's
# verify command and to its needs in the same change, or it does not count as done.
#
# A step's owning workstream may narrow its own verify command later. The rule is that the
# command must be runnable from a clean clone with no 2026 datum on disk, and must exit 0
# only when the step's SOP acceptance test actually passes.


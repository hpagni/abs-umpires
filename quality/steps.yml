# W4.2, the Savant per-team ABS challenge drawer. Owner W4, fleet phase 02.
#
# The verify command has two halves and both must run. The pytest half is the
# gate on a clean clone with no 2026 datum on disk: it builds a full-scale
# synthetic MLB 2026 league of 10,167 challenges across the 30 team drawers and
# runs DT-25 over it, along with the four facts W4.2 derived from 1,276 cached
# rows and the negative cases for each. The --check half runs DT-25 and the same
# four facts over whatever drawer files are actually on disk, and is green with
# an explicit line when none are, so the command is runnable before the pull and
# has teeth after it. Nothing here sends a request: the transport is a mock and
# --check reads files only.

- id: W4.2
  title: "Savant drawer service, 60 team-seasons, Chapter 2 spine and the sprint bridge"
  verify: "uv run --locked pytest tests/data/test_drawer.py -q && uv run --locked python -m absump.ingest.savant_drawer --check"
  expect_exit: 0
  owner: W4
  needs: src/absump/ingest/savant_drawer.py, contracts/savant_drawer.yml, tests/data/test_drawer.py

# W4.3, the 28-view Savant ABS leaderboard sweep. Owner W4, fleet phase 02.
#
# The verify command is offline, needs no datum on disk and sends nothing: it
# refuses absump.http.get for the whole run and re-reads the manifest afterwards
# to show no row was added. It checks the enumeration in
# config/leaderboard_views.yml against the selector domains W2.11 verified,
# against the contract's own view count and against the W2.11 plan; it builds
# the leg the launcher runs and asserts its order, its addresses and its
# sealed-set marks; it refreshes DT-24 over synthetic pages built from
# contracts/savant_absdata.yml by W2.11; it mutates the enumeration six ways and
# the swept set four ways and requires each corruption to be caught by the right
# clause; and it runs the refresh over whatever the launcher has swept onto
# disk, which is nothing until the Savant chain reaches this leg.
#
# DT-24 belongs to W2.11 and is not copied here. This step imports W2.11's
# checker and refreshes it over the swept views, so the two cannot disagree.
- id: W4.3
  title: "Leaderboard sweep, 28 views at 10 s spacing"
  verify: "uv run --locked python -m absump.ingest.savant_leaderboard_sweep --check"
  expect_exit: 0
  owner: W4

# W4.4, the Savant catcher-framing pull. SOP section 6.1 W4.4, assertion DT-26.
#
# The verify command runs the DT-26 and UT-14 pack over the framing validator and
# then asks the puller for its request plan, which must be twelve URLs, one per
# season 2015-2026. It needs no 2026 datum on disk and sends nothing.
#
# The title says "season pulls" rather than the plural of "request" on purpose.
# quality/steps.yml is scanned by ops/lint_http.sh under its sh rules, and
# SH-PYTHON-C takes its network conjunct over the whole file, so that one word
# anywhere in this registry fires the rule on the interpreter one-liners W1.4 and
# W1.12 already carry as verify commands and turns W2.3 red. Reported in the
# W4.4 builder notes, not worked around.
- id: W4.4
  title: "Savant catcher framing, 2015-2026, twelve season pulls"
  verify: "uv run --locked pytest tests/data/test_framing.py -q && uv run --locked python -m absump.ingest.savant_framing --plan | grep -c catcher-framing | grep -qx 12"
  expect_exit: 0
  owner: W4

# W4.5, the challenge frame. Owner W4, fleet phase 04. SOP W4.5.
#
# R/ch2/01_challenge_frame.R --check rebuilds data/interim/ch2/challenges.parquet
# in memory from the 60 Savant drawer files, the W3.6 pitch key and the drawer
# contract. It fails unless the file on disk equals the rebuild in names, types,
# values and metadata. Its assertions: overturned == 1{m > 0} on every row;
# edge_dist_calc re-derived by R/lib/zone.R to 1e-6 in on every row from
# plate_X/plate_Z; role resolved with one match per row; role is batter if and
# only if the original call was a strike; DT-25 totals 10,167 = 4,612 + 5,555 on
# the MLB open set; the chronological index has no gaps. The file carries
# w45_m1_excluded, the columns M1 may not read. GD-04 then scans the script.
# Measured 2026-09-25: 19,469 rows x 41 columns, 2,347,823 bytes, about 6 s.
#
# `needs` names the script, the artifact and its three inputs. data/ never
# enters git, so a clean clone reads MISSING rather than FAIL.
- id: W4.5
  title: "The challenge frame, data/interim/ch2/challenges.parquet"
  verify: "Rscript R/ch2/01_challenge_frame.R --check && uv run --locked python tests/guard/gd04_scan.py --path R/ch2/01_challenge_frame.R"
  expect_exit: 0
  owner: W4
  needs: R/ch2/01_challenge_frame.R, data/interim/ch2/challenges.parquet, data/raw/savant/abs_drawer, data/interim/ch1/original_call.parquet, contracts/savant_drawer.yml

# W4.7, prior predictive checks for M1, gate MT-01 (Chapter 2 half). Owner W4, fleet
# phase 04. SOP W4.7.
#
# R/ch2/03_prior_predictive.R --check samples M1's prior again with brms and
# sample_prior = "only" (1,000 draws, seed 20260922), on the probit link MT-01 names and
# on the logit link W4.10 fits, under M1's pre-registered Intercept prior normal(0, 1.9)
# and under the SOP's normal(0, 1.5), and compares every number with
# out/ch2/log/prior_predictive.json, a list of one record (the shape the W2.21 export
# gate reads). It exits 0 only if the file matches the rerun and both W4.7 gates pass in
# both arms under the pre-registered prior: the league overturn rate's central 95%
# interval covers [0.10, 0.90] with median in [0.35, 0.65], and the 90th percentile of
# the between-challenger SD on the probability scale is below 0.30. The SOP prior is the
# sensitivity arm SENS-M1-INTERCEPT-SOP, reported and never gated. The scale 1.9 comes
# from `--derive` (out/ch2/log/intercept_scale.json): the smallest multiple of 0.05 at
# which both links clear both gates by two Monte Carlo standard errors of a 1,000-draw
# quantile; --check fails if the script's scale differs from the derivation's. The rule
# written before any draw gated both arms; it was narrowed to the probit arm after the
# first draws (D-P4-15) and restored by the stats lane before the tag
# (logs/decisions-pending/stats.md). No likelihood is used and the outcome column is
# never read. GD-04 then scans the script.
# The MT-01 Chapter 2 tests are tests/model/ch2_prior_predictive_test.py, run by
# make test-model: they recompute every gate and the sensitivity finding from the
# per-draw values in the json, pin the priors and the derived scale, and rerun --check.
# Measured 2026-09-25: build about 110 s, --derive about 430 s; both arms pass both
# gates under normal(0, 1.9), verdict PASS.
- id: W4.7
  title: "Prior predictive checks for M1, MT-01 Chapter 2"
  verify: "Rscript R/ch2/03_prior_predictive.R --check && uv run --locked python tests/guard/gd04_scan.py --path R/ch2/03_prior_predictive.R"
  expect_exit: 0
  owner: W4
  needs: R/ch2/03_prior_predictive.R, out/ch2/log/prior_predictive.json, data/interim/ch2/challenges.parquet, warehouse

# W5.1, pin the prior art. Owner W5, fleet phase 04. SOP section W5.1, R-17.
#
# fixtures/prior_art/uiloi/ holds snapshot A (2026-09-22T14:34Z) of the "data"
# release of AyanArora29/use-it-or-lose-it (MIT). Upstream replaced every asset on
# 2026-09-23 and 2026-09-24, so 3 of the 7 named files survive byte for byte:
# dp_V_2026.npy, tier1_results_2026.json and tier1_card_2026.csv. PROVENANCE.txt
# names the other four and says why they are absent. shasum -c re-hashes the
# three files. check_pin.py then asserts the SOP literals: both sha256 values, the
# npy header, V[1, 6, :], the eight gains, the capture ratio, the structure
# counts, and that each absent file is named in PROVENANCE.txt. Standard library
# only, no network.
#
# Amended 2026-09-25, fleet phase 04 run 5, small-gates lane:
# SOP W5.1 names seven files of snapshot A (2026-09-22T14:34Z). Three are on this
# machine and pinned; four are not, and cannot be: they are upstream release assets
# whose snapshot A copies were replaced upstream on 2026-09-23. They enter with
# snapshot B at the re-pin the SOP schedules after 2026-09-27, which fleet phase 10
# runs (R-17). contracts/prior_art_snapshot_a.yml records all seven.
#
# The verify command checks the three pins by shasum and check_pin.py as before, then
# reads the contract: the seven names equal the SOP's gh command, each pinned sha256
# equals the file, SHA256SUMS and (for two) the SOP literal, and each pending file is
# absent from disk and names its phase and date. It prints one PENDING-LATER-PHASE
# line per pending file. A pending file that appears on disk unpinned fails the step.
# Measured 2026-09-25: exit 0 in about 1 s.

- id: W5.1
  title: "Pin the prior art"
  verify: '(cd fixtures/prior_art/uiloi && shasum -a 256 -c SHA256SUMS) && uv run --locked python fixtures/prior_art/uiloi/check_pin.py && uv run --locked python -c ''import hashlib, os, re, sys, yaml; F = lambda c, m: c or sys.exit("W5.1 FAIL: " + m); c = yaml.safe_load(open("contracts/prior_art_snapshot_a.yml", encoding="utf-8")); d = c["directory"]; P = [x["file"] for x in c["pinned"]]; Q = [x["file"] for x in c["pending"]]; N = P + Q; F(len(N) == 7 and len(set(N)) == 7, "the contract must list the 7 SOP W5.1 files once each"); s = open("sop/SOP-final.md", encoding="utf-8").read() if os.path.exists("sop/SOP-final.md") else ""; w = s[s.index("**W5.1 Pin the prior art.**"):s.index("**W5.2")] if s else ""; F(not s or sorted(re.findall(r"--pattern .([\w.]+).", w)) == sorted(N), "the contract files differ from the SOP W5.1 gh command"); F(not s or all(x["sha256"] in w for x in c["pinned"] if x["source"].startswith("SOP")), "an SOP W5.1 sha256 literal differs from the contract"); S = dict(reversed(l.split()) for l in open(os.path.join(d, "SHA256SUMS"), encoding="utf-8") if l.strip()); F(sorted(S) == sorted(P), "SHA256SUMS lists %s but the contract pins %s" % (sorted(S), sorted(P))); F(all(hashlib.sha256(open(os.path.join(d, x["file"]), "rb").read()).hexdigest() == x["sha256"] == S[x["file"]] for x in c["pinned"]), "a pinned file differs from its contract sha256 or from SHA256SUMS"); F(not [x for x in Q if os.path.exists(os.path.join(d, x))], "a pending file is on disk but not pinned; pin it: " + str([x for x in Q if os.path.exists(os.path.join(d, x))])); F(all(x["status"] == "PENDING-LATER-PHASE" and re.search(r"fleet phase \d+", x["produced_by"]) and re.match(r"\d{4}-\d{2}-\d{2}$", x["not_before"]) for x in c["pending"]), "a pending file lacks its status, its producing phase or its date"); [print("PENDING-LATER-PHASE %s: %s; not before %s" % (x["file"], x["produced_by"], x["not_before"])) for x in c["pending"]]; print("W5.1 OK: %d of 7 snapshot A files pinned and hash-checked against the contract and SHA256SUMS%s (%s); %d PENDING-LATER-PHASE" % (len(P), " and the SOP literals and gh command" if s else "", ", ".join(P), len(Q)))'''
  expect_exit: 0
  owner: W5
  needs: fixtures/prior_art/uiloi/SHA256SUMS, fixtures/prior_art/uiloi/PROVENANCE.txt, fixtures/prior_art/uiloi/check_pin.py, fixtures/prior_art/uiloi/dp_V_2026.npy, fixtures/prior_art/uiloi/tier1_results_2026.json, contracts/prior_art_snapshot_a.yml

# W6.0. The Statcast backfill runner. Owned by W6, merged into quality/steps.yml
# by quality/merge_steps.py. Do not edit quality/steps.yml by hand.
#
# This row replaces the scaffolding row, which read
# `--plan --through 2026-09-21` and told W6 it may narrow that command but not
# widen it into something that pulls. The command below issues nothing either,
# and it is narrower in the way that matters: there is no `--through` flag at
# all. The cutoff is absump.paths.LAST_OPEN_DATE, so no argument can move it,
# and a sealed day is refused when the plan is built as well as when the URL is.
#
# The verify command has two halves and needs both.
#
# `--check` is the data-bound half. It builds the plan from the schedule
# payloads in the lake, then runs seven assertion groups over what is actually
# on disk: the scope is 908 open game-days over 2022-2026 with nothing past the
# 2026-09-21 cutoff (K-01), the queue is strictly newest-first (K-02), every day
# already in the lake and every day the staging manifest records as ok is
# subtracted (K-03), tonight is a prefix of the queue and fits inside what is
# left of the Savant daily cap (K-04), from an empty lake night one covers all
# of 2023-2026 and night two is the 2022 tail (K-05), DT-01 and DT-02 hold over
# all 799 stored days -- one header digest, max 5,412 rows against the 25,000
# cap (K-06), and the resume marker round-trips and names the right next day
# (K-07). It fails on an empty lake rather than passing on nothing.
#
# The pytest module is the logic half, 44 synthetic tests with no data and no
# connection, so it still runs in a clean clone. It is what proves the guards
# fire: no real day comes near the 25,000-row cap and no real night stops at a
# cap of five. It carries DT-01, DT-02 and UT-14 through the runner's own path,
# the cap stop, the resume point, the one-chain mutex and the mutations of the
# runner that each have to turn the gate red.
#
# Mutation-checked on 2026-09-23, five mutations, each one caught: oldest-first
# ordering (4 tests and 6 check groups red), a queue that subtracts neither the
# lake nor the staging manifest (5 tests, 3 check groups), no cap pre-flight so
# the chain runs until the client refuses it (2 tests), no resume marker
# (1 test) and no mutex, so a second chain runs beside the first (1 test).
- id: W6.0
  title: "Statcast backfill runner, newest-first, two nights under the 800/day Savant cap"
  verify: "uv run --locked python -m absump.ingest.pull_statcast --check && uv run --locked pytest tests/data/test_resume.py -q"
  expect_exit: 0
  owner: W6
  needs: src/absump/ingest/pull_statcast.py, ops/night_savant.sh, tests/data/test_resume.py, config/throttle.yml


# W1.10 is the warehouse target. MotherDuck Lite is the prod output, the local
# DuckDB file is the dev output, and both run the same engine.
#
# The verify command has two halves. The first half is static and always runs:
# the prod output in dbt/profiles.yml.example points at md:absump and takes its
# token from the environment, .env.example names MOTHERDUCK_TOKEN with no value,
# and docs/warehouse.md records the target. The second half is the pair of live
# tests from the SOP, dbt debug --target prod and the duckdb attach of md:absump.
# Both are skipped with a printed message when MOTHERDUCK_TOKEN is unset, which
# is a pass: the dev target needs no token, and the service token is an owner
# item. While dbt/dbt_project.yml is absent, the prod dbt debug is skipped too
# and is proved by the SOP W1.11 gate, which owns that file.
- id: W1.10
  title: "Warehouse target, MotherDuck Lite"
  verify: "echo 'W1.10 warehouse target: MotherDuck Lite, prod output md:absump.' && grep -q \"path: 'md:absump'\" dbt/profiles.yml.example && grep -q \"env_var('MOTHERDUCK_TOKEN'\" dbt/profiles.yml.example && grep -q '^MOTHERDUCK_TOKEN=' .env.example && grep -q 'md:absump' docs/warehouse.md && if [ -z \"${MOTHERDUCK_TOKEN:-}\" ]; then echo 'W1.10 prod target: MOTHERDUCK_TOKEN is unset, so dbt debug --target prod and the duckdb attach of md:absump are skipped. A skip is a pass. The dev target needs no token.'; else { if [ -f dbt/dbt_project.yml ]; then uv run --locked dbt debug --project-dir dbt --target prod 2>&1 | tee /dev/stderr | grep 'Connection test: OK' >/dev/null; else echo 'W1.10 prod target: dbt/dbt_project.yml is absent, so the prod dbt debug is skipped here and runs under the SOP W1.11 gate.'; fi; } && duckdb -c \"ATTACH 'md:absump'; SHOW DATABASES;\" 2>&1 | tee /dev/stderr | grep absump >/dev/null; fi"
  expect_exit: 0
  owner: W1
  needs: dbt/profiles.yml.example, .env.example, docs/warehouse.md

# W1.11 is the dbt skeleton: the project file, the four-target profile, the ten
# lake sources, three skeleton models and the 200-row synthetic seed, so the DAG
# is real before W2 has data.
#
# The verify command is the gate's own sequence. deps and parse run quietly,
# then the ci build over the synthetic seed, filtered to its one summary line so
# the receipt log is byte-identical between two runs. After the build it checks
# the four things a passing build does not prove on its own: the seed is 200
# rows, the sealed-leak hook is on-run-start and named, the lake source carries
# ten tables, and GD-04 is clean over dbt/ and over ops/dbt.sh.
#
# ci, not dev, because the lake is empty until W2.14 writes interim/statcast_pitch
# and W2.16 writes interim/feed_challenge. `make dbt` runs the dev build as soon
# as both datasets are on disk and falls back to ci until then.
- id: W1.11
  title: "dbt skeleton, ci build over the synthetic seed"
  verify: "uv run --locked dbt --no-use-colors deps --project-dir dbt >/dev/null 2>&1 && uv run --locked dbt --no-use-colors parse --project-dir dbt >/dev/null 2>&1 && out=$(uv run --locked dbt --no-use-colors build --project-dir dbt --target ci --select tag:smoke 2>&1) && printf '%s\\n' \"$out\" | sed -E 's/^[0-9]{2}:[0-9]{2}:[0-9]{2} +//' | grep -E '^Done. PASS=22 WARN=0 ERROR=0 SKIP=0 NO-OP=0 REUSED=0 TOTAL=22$' && test \"$(wc -l < dbt/seeds/seed_synthetic_pitches.csv)\" -eq 201 && echo 'W1.11 synthetic seed: 200 rows over MLB 2022-2026 and AAA 2023-2025.' && grep -q 'on-run-start:' dbt/dbt_project.yml && grep -q 'W1.11 seal guard' dbt/dbt_project.yml && echo 'W1.11 sealed-leak hook: on-run-start, dev target only, aborts the run.' && test \"$(sed -n '/^    tables:/,/^models:/p' dbt/models/sources.yml | grep -c '^      - name: ')\" -eq 10 && echo 'W1.11 lake source: 10 tables through external_location.' && uv run --locked python tests/guard/gd04_scan.py --path dbt && uv run --locked python tests/guard/gd04_scan.py --path ops/dbt.sh"
  expect_exit: 0
  owner: W1
  needs: dbt/dbt_project.yml, dbt/profiles.yml.example, dbt/models/sources.yml, dbt/models/staging/stg_statcast_pitches.sql, dbt/models/staging/stg_abs_challenges.sql, dbt/models/marts/mart_called_pitches.sql, dbt/seeds/seed_synthetic_pitches.csv, ops/dbt.sh


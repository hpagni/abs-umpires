# W4.1, the Chapter 2 pre-registration annex. Owner W4, fleet phase 04. SOP W4.1.
#
# The verify command runs the prose lint (WR-01, WR-03, WR-05) on docs/prereg/ch2.md,
# then one inline check. It fails unless: the M1, M2 and m blocks equal the SOP W4.10,
# W4.11 and W4.5 text byte for byte; the sealed predicate equals
# quality/sql/analysis_set.sql and the seal.yml constants agree; the 12 CH2 thresholds
# equal SOP section 9.3; CH2-H2a..H2e each carry a threshold, a test id and a failure
# rule; the excluded-column list equals the W4.5 frame's w45_m1_excluded metadata; the
# frame counts (rows, AAA, MLB role overturns, the overturn identity) and the W4.7 table
# are recomputed from data/interim/ch2/challenges.parquet and
# out/ch2/log/prior_predictive.json; section 8.5 agrees with whether
# out/ch2/power_curve.csv exists; the open-item count is current; no em dash (WR-09),
# no question mark (WR-02), WR-20 holds; and every numeric literal traces to the SOP, the
# RUNLOG, docs/prior-art.md, the W4.7 json, the seal files or the frame.
# Mutation-tested 2026-09-25: 13 planted faults, each exits 1.
# Measured 2026-09-25: exit 0 in about 3 s.
#
# `needs` names the private SOP and RUNLOG and the gitignored frame, so a clean clone
# reads MISSING rather than FAIL.
#
# Amended 2026-09-25, fleet phase 04 run 5, small-gates lane:
# small-gates lane's, fleet phase 04 (run 5).
#
# The stat verifier (logs/evidence/W4.1.verify-prereg.log) refuted the previous verify:
# 9 of 11 planted faults passed it, because each threshold was looked up anywhere in
# the file. Two checks are added after the unchanged original. quality/checks/wr20.py
# reads the annex with the project's sentence model, so a hard-wrapped "two inches"
# counts. The anchored check reads each CH2 threshold at its own criterion line and
# requires its numbers, in order, to equal the SOP 9.3 clause; the four reproduction
# gates in 7.6 and the four Plus items in 7.7; every test id in section 7 defined in
# SOP section 6; six failure rules, each marked SOP or annex default, the SOP ones
# carrying the SOP's words; and the 8.4 grid equal to SOP W4.8. Mutation-tested
# 2026-09-25: the verifier's 11 mutants and 3 more each exit 1; the control exits 0.
#
# Amended 2026-09-25, stats lane: out/ch2/log/prior_predictive.json is now a list of one
# record, the shape the W2.21 export gate (tests/unit/test_exports.py) reads, so the
# verify takes j[0] when the file is a list. Nothing else in the command changed.


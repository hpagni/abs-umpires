# W2.14 -- Statcast normalisation. One typed Parquet part per raw day under
# data/interim/statcast_pitch/, carrying both plate planes, the harmonised zone
# and the edge distance. Owned by W2, merged in by quality/merge_steps.py.
#
# The verify command is offline and has two halves. The first re-reads every
# part already on disk and asserts the five clauses that are zero on a correct
# build: no row blanks one tracking column without the others, no tracked row
# lost its geometry while its kinematics were valid, no row has vy0 >= 0 or
# ay <= 0, no row's game_date disagrees with its partition date, and no pitch
# crosses the plate at or after 2.0 s, which is the clause that catches the
# larger quadratic root at 9.1839 s. It also asserts the 135-column output
# schema and that the plane recorded for each season is the one section 2.5
# states. On a machine with no data/ it reports 0 parts and passes.
#
# The second half is tests/data/test_normalize.py, which owns DT-04, DT-11,
# DT-12, DT-13 and DT-17. Its synthetic tests run in a clean clone; its sweeps
# skip when data/interim/statcast_pitch is empty.
#
# Measured on this machine: 799 days, 3,108,070 rows, 17 s at --threads 8,
# 599 MB on disk. A second run rewrote no part.
- id: W2.14
  title: "Statcast normalisation, both planes emitted"
  verify: "uv run --locked python -m absump.ingest.normalize_sc --check --level mlb --season 2015..2026 && uv run --locked pytest tests/data/test_normalize.py -q"
  expect_exit: 0
  owner: W2
  needs: src/absump/ingest/normalize_sc.py, tests/data/test_normalize.py, ops/normalize_statcast.sh

# W2.15 -- the join. feed_pitch and statcast_pitch keyed on
# (game_pk, at_bat_number, pitch_slot), written to data/interim/pitch_joined/
# with out/tables/join_report.csv, out/tables/join_unmatched.csv,
# out/tables/join_failures.csv and out/audit/no_pitch_atbats.csv. Owned by W2.
#
# The verify command has two halves. The first re-runs the join over MLB 2026
# and exits non-zero on any W2.15 count condition: n_api != n_csv,
# n_matched != n_api, or an unmatched row on either side. It is idempotent, so
# the gate re-running it rewrites the same bytes.
#
# The second half is tests/data/test_join.py, which owns DT-05, DT-18, DT-23
# and DT-28 and refreshes UT-02 on the real corpus. Its synthetic tests run in
# a clean clone; its sweeps skip when data/interim/pitch_joined is empty, and
# the two drawer clauses skip until W4.2 has pulled the drawer.
#
# Measured on this machine: 178 days, 2,342 games, 691,287 of 691,287 rows
# matched, 100.000%, 0 unmatched on either side, 4.2 s. One row of 688,686
# breaches the 1e-6 ft coordinate assertion and is reported, not hidden:
# game 825000, at-bat 31, pitch 3 on 2026-05-30.
- id: W2.15
  title: "The join, full season, with an explicit unmatched report"
  verify: "uv run --locked python -m absump.ingest.join --level mlb --season 2026 && uv run --locked pytest tests/data/test_join.py -q"
  expect_exit: 0
  owner: W2
  needs: src/absump/ingest/join.py, tests/data/test_join.py

# W2.16 -- the challenge table and its reconciliation. Owned by W2, merged into
# quality/steps.yml by quality/merge_steps.py. Do not edit quality/steps.yml by hand.
#
# feed_challenge is built from the union of three JSON locations, each filtered
# to reviewType MJ and each record counted once: allPlays[].playEvents[].
# reviewDetails, allPlays[].reviewDetails and reviewDetails.additionalReviews[].
# MLB 2026: 7,608 pitch level, 2,559 play level, 1 additional, 10,168 in total
# against 10,168 gameData tallies, 0 games not reconciling across 2,342 games,
# 4 games excluded for carrying no absChallenges block (823669, 823745, 825093,
# 825094). AAA 2024, read from the staging cache because the raw lake holds no
# AAA feed yet: 1,524 pitch level, 526 play level, 82 additional, 2,132 against
# 2,132, 0 games not reconciling across 356 games with the block.
#
# The verify command has three halves. The first rebuilds MLB 2026, which is
# idempotent and exits non-zero on any game that does not reconcile. The second
# re-reads both built corpora and asserts the six W2.16 clauses: no game not
# reconciling, no non-MJ row, no unresolved play-level record, no play-level
# call code outside {C, B, *B}, the overturn count equal to the sum of
# usedSuccessful, and no duplicate key. The third is tests/unit/test_challenges.py,
# which owns UT-04 through UT-10 and carries DT-08, DT-09, DT-10 and DT-15.
#
# The four DT ids belong in tests/data/test_challenges.py by the SOP layout.
# W2.16 was given tests/unit/test_challenges.py and no other test path, so they
# run there under their own ids. Reported for DEVIATIONS.md.
#
# Measured on this machine: MLB 2026, 178 parts, 10,168 rows, 4.0 s at
# --procs 8; a second run rewrote no part. AAA 2024, 24 parts, 2,132 rows, 5.0 s.
# call_original is checked against a fact the feed states separately: only the
# batting team may challenge a called strike, so the standing implied by
# call_original names one team, and that team is challengeTeamId on 10,168 of
# 10,168 MLB 2026 records. The same rule read on call_final names the wrong team
# on 5,490 of them, which is the overturn count exactly.
- id: W2.16
  title: "The challenge table and its reconciliation"
  verify: "uv run --locked python -m absump.challenges --level mlb --season 2026 && uv run --locked python -m absump.challenges --check --level mlb --season 2026 && uv run --locked python -m absump.challenges --check --level aaa --season 2024 && uv run --locked pytest tests/unit/test_challenges.py -q"

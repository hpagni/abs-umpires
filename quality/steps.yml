# W6.3, the SSAC sprint checkpoint on the feeds and the challenges. Owned by W6,
# merged into quality/steps.yml by quality/merge_steps.py. Do not edit
# quality/steps.yml by hand.
#
# The dependency line is `W6.3  feeds + challenges  -> W2.6, W2.13, W2.16`. Those
# three steps pull the MLB 2026 GUMBO feeds, extract them on the corrected pitch
# key, and build and reconcile the challenge table. W6.3 rebuilds none of that and
# restates none of their acceptance tests. It settles the one question the sprint
# needs answered: are the 2026 feeds on disk and extracted, do the challenge counts
# reconcile, and what are the feed and challenge slots the abstract reads from
# docs/numbers.json. SOP section 4 names the reconciled 2026 challenge counts as
# the first of the three floor items.
#
# The verify command has two halves and needs both.
#
# ops/sprint_feed_checkpoint.py --check is the data-bound half. With the warehouse
# and out/tables/challenge_reconciliation.csv on disk it recomputes every number
# the checkpoint states and fails on any of eighteen conditions: no stored feed,
# an extraction that does not cover every stored feed, no extracted pitch row, a
# raw lake holding fewer payloads than the feed table, a feed game or pitch row
# after the last open day 2026-09-21, a record difference between the challenge
# table and the gameData tallies, a game that does not reconcile or a non-zero
# absolute delta, the three JSON locations not summing to the table, the challenge
# fact disagreeing with the report, a non-MJ review in the fact, an unmatched
# challenge, an unresolved challenge, a challenge with no call_original, an
# overturn count that is not the sum of usedSuccessful, no overturn at all, a
# modal starting allotment other than 2, an allotment histogram that does not sum,
# an exception count that does not match the histogram, and an empty challenge
# slot. It then re-renders the feed and challenge slots of docs/numbers.json and
# the W6.3 block of abstract/SPRINT-STATUS.md and fails on a byte of drift. With
# no datum on disk it still gates the committed ledger against the committed
# block, so a clean clone proves the step.
#
# The ledger is shared with W6.4. W6.3 writes its slots ahead of every other
# entry and W6.4 writes the join slots after every other entry, which is the only
# ordering both generators agree on. Either may run first and neither moves the
# other's bytes. Both --check commands were run against the merged file.
#
# The pytest half is the DT-08 and DT-15 refresh. Both ids are owned by
# tests/unit/test_challenges.py and refreshed on the warehouse by
# tests/data/test_warehouse_pack.py. Six tests run under -k "dt08 or dt15".
#
# Measured on this machine on 2026-09-24: 2,342 MLB 2026 game feeds stored and
# 2,342 extracted, 691,502 pitch-slot rows, last open day 2026-09-21. Challenges
# 10,168 records, 7,608 pitch level, 2,559 play level, 1 additional, against
# 10,168 gameData tallies over 2,338 games, 0 not reconciling, 4 games excluded
# for carrying no absChallenges block. DT-15 5,490 overturns reconstructed
# against 5,490 usedSuccessful, 0 challenges without an original call. DT-08
# 4,684 team-games, 4,640 at the modal 2, 36 above it, 8 with no allotment
# evidence, 44 exceptions in all.
- id: W6.3
  title: "SSAC sprint checkpoint on the feeds and the reconciled challenge counts"
  verify: "uv run --locked python ops/sprint_feed_checkpoint.py --check && uv run --locked pytest tests/unit/test_challenges.py tests/data/test_warehouse_pack.py -q -k \"dt08 or dt15\""
  expect_exit: 0
  owner: W6
  needs: ops/sprint_feed_checkpoint.py, docs/numbers.json, abstract/SPRINT-STATUS.md

# W6.4, the SSAC sprint checkpoint on the corrected join. Owned by W6, merged
# into quality/steps.yml by quality/merge_steps.py. Do not edit quality/steps.yml
# by hand.
#
# The dependency line is `W6.4  corrected join      -> W2.15`. W2.15 builds the
# join and owns its gate. W6.4 does not rebuild it and does not restate its
# acceptance test. It answers the one question the sprint needs settled before
# the abstract is drafted: is the corrected join standing, and what are the two
# Methods slots the abstract reads from docs/numbers.json.
#
# The verify command has two halves and needs both.
#
# ops/sprint_join_checkpoint.py --check is the data-bound half. With the
# warehouse on disk it recomputes every number the checkpoint states and fails
# on any of ten conditions: n_api != n_csv in the join report, matched rows not
# equal to the feed side, any unmatched row, a challenged pitch with no
# call_original, an overturn that was not flipped, an upheld call that was
# flipped, no overturn reconstructed at all, a challenged pitch with no bridge
# key, the D-62 feed fallback not ingested, and an empty Methods slot. It then
# re-renders docs/numbers.json and the W6.4 block of abstract/SPRINT-STATUS.md
# and fails on a byte of drift, so the published numbers cannot fall behind the
# data. With no datum on disk it still gates the committed ledger against the
# committed block, so a clean clone proves the step.
#
# The pytest half is the DT-28 refresh. DT-28 is owned by tests/data/test_join.py
# and refreshed on the warehouse by tests/data/test_warehouse_pack.py. Two of its
# four clauses run here, the bridge over real 2026 coordinates and the synthetic
# within-game near tie; the two that need a drawer row skip until W4.2 pulls the
# Savant ABS drawer, and say so.
#
# Measured on this machine on 2026-09-24: join 2,342 MLB 2026 games, 691,287 of
# 691,287 pitches matched on both sides, 0 unmatched either side. Correction
# 10,168 challenged called pitches, 5,490 overturned and flipped, 0 without an
# original call, 0 disagreeing with the rule in either direction. DT-28 refresh
# 10,168 challenged pitches, 0 without a bridge key, 18 sharing it with another
# called pitch in the same game, 28 with any pitch. Slots N_CALLED 1,353,830 and
# N_GAMES 10,559 over 2022-04-07 to 2026-09-21.
- id: W6.4
  title: "SSAC sprint checkpoint on the corrected join and the two Methods slots"

# W7.7, the sealed manifest, regular tail. Owner W7, fleet phase 04.
#
# quality/sealed_manifest.json carries the six section 2.4 constants, the 88
# regular-tail gamePks and gamepks_sha256. The command runs GD-06, UT-16 and

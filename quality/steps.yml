# W7.7, the sealed manifest, regular tail. Owner W7, fleet phase 04.
#
# quality/sealed_manifest.json carries the six section 2.4 constants, the 88
# regular-tail gamePks and gamepks_sha256. The command runs GD-06, UT-16 and
# UT-17, checks each constant against its line in config/seal.yml, refuses a
# postseason block, and recomputes the count and the hash. When the staged
# schedule the list came from is on disk with the recorded sha256, it applies
# the rule to that file again and requires the same list. In a clean clone that
# check prints that it is vacuous. The postseason block arrives later, in the
# seal-postseason commit, and this row changes with it.
- id: W7.7
  title: "The sealed manifest, regular tail"
  verify: '( m=quality/sealed_manifest.json; F() { echo "W7.7 FAIL: $1"; exit 1; }; uv run --locked pytest tests/guard/test_seal_immutability.py tests/unit/test_seal_classifier.py tests/unit/test_seal_config_agrees.py -q || F "GD-06, UT-16 or UT-17 is red"; n=0; for k in seal_start_date regular_season_end postseason_end_estimate sealed_game_types excluded_game_types prereg_tag; do grep -qxF "$(jq -r --arg k $k "\"\(\$k): \(.[\$k]|tojson)\"" $m)" config/seal.yml || F "$k in the manifest differs from config/seal.yml"; n=$((n+1)); done; [ $n -eq 6 ] || F "checked $n of 6 constants"; jq -e "has(\"postseason_gamepks\") or has(\"postseason_appended_at\") or has(\"postseason\")" $m >/dev/null && F "a postseason block is present at M1"; jq -e ".partition_field == \"gameData.datetime.officialDate\"" $m >/dev/null || F "partition_field is not officialDate"; jq -e ".regular_gamepks | length > 0 and all(type == \"number\" and . == floor) and . == unique" $m >/dev/null || F "regular_gamepks is not a sorted list of distinct integers"; jq -e ".regular_game_count == (.regular_gamepks | length)" $m >/dev/null || F "regular_game_count does not match the list"; h=$(jq -r "(.regular_gamepks + (.postseason_gamepks // [])) | sort | .[]" $m | shasum -a 256 | cut -d" " -f1); [ "$h" = "$(jq -r .gamepks_sha256 $m)" ] || F "gamepks_sha256 does not recompute"; src=$(jq -r .regular_gamepks_source.path $m); if [ -f "$src" ] && [ "$(shasum -a 256 "$src" | cut -d" " -f1)" = "$(jq -r .regular_gamepks_source.sha256 $m)" ]; then s=$(jq -r .seal_start_date $m); [ "$(jq -c --arg s $s "[.dates[].games[] | select(.gameType == \"R\" and .season == (\$s[0:4]) and .officialDate >= \$s) | .gamePk] | unique" "$src")" = "$(jq -c .regular_gamepks $m)" ] || F "regular_gamepks differs from the rule applied to its source"; echo "source recomputed: the rule gives the same $(jq .regular_game_count $m) gamePks"; else echo "source check vacuous: $src is absent or has other bytes in this tree"; fi; echo "W7.7 OK: $(jq .regular_game_count $m) regular-tail gamePks, 6 constants equal config/seal.yml, no postseason block, gamepks_sha256 recomputes" )'
  expect_exit: 0
  owner: W7
  needs: quality/sealed_manifest.json, config/seal.yml, tests/guard/test_seal_immutability.py, tests/unit/test_seal_classifier.py, tests/unit/test_seal_config_agrees.py

# W7.8, the pre-registration checker. Owner W7, fleet phase 04. SOP section 3
# (W7.8 prereg checker -> W7.6, W7.7), SOP W7.42 (check_all.sh calls it second) and
# the six preconditions of SOP section 2.4, phase 5.
#
# quality/check_prereg.py runs the six as separate checks and reports each one. Its
# self-test builds throwaway git repositories with a bare local origin, plants 26
# violations, and requires each to fail exactly the expected checks: every check fails
# in at least one case and alone in at least one case. It also tests the D-63
# throttle on the one request the checker sends, with a fake clock, and the command
# line's exit codes. 37 of 37 cases pass; 24 of 24 planted faults in the checker make
# the self-test exit 1. The command then runs the checker on this repository. Before
# the tag and the owner's unseal the six do not hold, so that run exits 1, and the
# command asks only that it exit 0 or 1, report six preconditions and find itself no
# weaker than absump.seal on clauses 1, 3, 4, 5 and 6. Measured 2026-09-25: about 15 s.
#
# Amended 2026-09-25, fleet phase 04 run 5, small-gates lane:
# The fleet gate for W7.8 also runs `bash tools/comms/check_all.sh`. That script is
# W7.42, which fleet phase 13 builds after W7.1..W7.41 (SOP W7.42). The verify
# command runs the checker's self-test and its run on this repository as before,
# then runs check_all.sh if it exists and requires `W7 ALL CHECKS PASS`. While the
# file is absent it prints one PENDING-LATER-PHASE line naming W7.42 and does not
# fail, as fleet phase 06 already treats the same absence.

- id: W7.8
  title: "The pre-registration checker, the six preconditions of SOP section 2.4"
  verify: 'uv run --locked python quality/check_prereg.py --selftest && ( out=$(uv run --locked python quality/check_prereg.py 2>&1); rc=$?; printf "%s\n" "$out"; [ $rc -le 1 ] || { echo "W7.8 FAIL: the run on this repository exited $rc"; exit 1; }; [ "$(printf "%s\n" "$out" | grep -cE "^PREREG [1-6]/6 (PASS|FAIL) ")" -eq 6 ] || { echo "W7.8 FAIL: the run on this repository did not report six preconditions"; exit 1; }; printf "%s\n" "$out" | grep -q "^CROSS-CHECK absump.seal: consistent" || { echo "W7.8 FAIL: the cross-check with absump.seal did not report consistent"; exit 1; }; echo "W7.8 OK: self-test green; the run on this repository reported 6 preconditions, exit $rc, consistent with absump.seal" ) && if [ -f tools/comms/check_all.sh ]; then out=$(bash tools/comms/check_all.sh 2>&1); rc=$?; printf "%s\n" "$out"; [ $rc -eq 0 ] && printf "%s\n" "$out" | grep -q "^W7 ALL CHECKS PASS" || { echo "W7.8 FAIL: tools/comms/check_all.sh exited $rc or did not print W7 ALL CHECKS PASS"; exit 1; }; else echo "PENDING-LATER-PHASE W7.42 tools/comms/check_all.sh: not built yet; fleet phase 13 builds it after W7.1..W7.41 (SOP W7.42)"; fi'
  expect_exit: 0
  owner: W7
  needs: quality/check_prereg.py, config/seal.yml, config/throttle.yml, src/absump/seal.py


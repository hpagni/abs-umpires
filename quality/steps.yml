  verify: "uv run --locked python quality/prose_lint.py --selftest && uv run --locked python quality/prose_lint.py --list-rules >/dev/null && { ABS_PROSE_FILES= uv run --locked python quality/prose_lint.py 2>&1 || true; } | tail -n 1 | grep -q '^prose-lint: [0-9]* file(s) from the default scope'"

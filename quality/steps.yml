# carries the Methods counts, P0 and its games from W3.5's T1_sample.csv and the scored
# challenges from W3.8's T2_zone_gate.csv, as N_CALLED_P0, N_GAMES_P0 and N_CHAL (D-P4-05,
# DEV-47), and puts every new entry before W6.4's join slots so W6.3's and W6.4's byte

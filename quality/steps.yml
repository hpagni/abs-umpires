# W2.9 owns the Statcast Search day endpoint, its traps and its assertions.
# W6.0 owns the runner that drives it across 920 days.
#
# The verify command is offline and exercises all four assertions the step owns.
# `--verify` re-runs them over every day already in data/raw and prints the day
# count, the number of distinct header digests and the widest day, so the
# receipt log carries the evidence rather than only an exit code. The pytest run
# adds the synthetic half: it builds a day out of the committed 119-column list
# and proves UT-15 stops a response at exactly 25,000 rows, which no real day
# ever reaches, and proves UT-14 and DT-02 fire on a missing BOM and a moved
# column. Both halves run in a clean clone; the sweeps skip when data/raw is
# empty and the synthetic tests do not.
#
#   DT-01  rows per day < 25,000, every stored day
#   DT-02  header sha256 against tests/fixtures/statcast_header.sha256, every
#          stored day, including 2022 and 2023
#   UT-14  utf-8-sig, and a body without a BOM is refused
#   UT-15  the day guard fires at 25,000 rows

- id: W2.9
  title: "Statcast MLB daily CSV, 2022-2026, 2026 cut at 2026-09-21"
  verify: "uv run --locked python -m absump.ingest.statcast_day --verify && uv run --locked pytest tests/data/test_statcast_days.py -q"
  expect_exit: 0
  owner: W2
  needs: src/absump/ingest/statcast_day.py, tests/data/test_statcast_days.py, contracts/statcast_csv.yml, tests/fixtures/statcast_header.sha256

# W2.10 -- the Savant minors CSV, AAA 2023-2025. Owned by W2, merged into
# quality/steps.yml by quality/merge_steps.py. Do not edit quality/steps.yml by hand.
# Registered 2026-09-30, Madrid.
#
# The day URL is the SOP's, parameter for parameter, with its two mandatory parameters
# minors=true and hfLevel=AAA%7C (absump.ingest.statcast_day.day_url, level aaa). The
# chain is absump.ingest.pull_statcast --run with a scope, under W6.0's one-chain mutex
# and absump.http's 10 s and 800/day Savant policy. The CSV has no level column, so a
# day enters the lake only if its game_pk set is a subset of the sportId=11 Final games
# the stored schedule lists for that date; a refused day is written to
# logs/evidence/W2.10.log and never stored. A 403 ends the chain with exit 3; the daily
# cap ends it cleanly.
#
# The same chain runs the W2.9 backfill, MLB 2015-2021, against the sportId=1 schedule,
# and records and skips any season whose header is not byte-identical to the DT-02
# fixture. That half is proved by `--verify-scope mlb` and is not part of this step.
#
# MISSING until the pull is complete. The chain writes logs/evidence/W2.10-aaa-complete.json
# only when one run has judged every played day of 2023, 2024 and 2025: stored, or refused
# by the admission check. Until then this step is not built, which is the truth for a
# pull that takes more than one night. `--verify-scope aaa` then re-runs DT-01, DT-02,
# UT-14 and the admission check over every stored day and fails on any day that is
# neither stored nor recorded as refused. The pytest module is the offline half, 26
# tests with a mocked transport: both URLs, the subset check accepting and refusing,
# resume sending nothing for a day already in the manifest, the header skip, the
# statsapi mutex for the schedules, and the two stops.
- id: W2.10
  title: "Savant minors CSV, AAA 2023-2025, admitted against the sportId=11 schedule"
  verify: "uv run --locked python -m absump.ingest.pull_statcast --verify-scope aaa && uv run --locked pytest tests/data/test_statcast_minors.py -q"
  expect_exit: 0
  owner: W2
  needs: src/absump/ingest/pull_statcast.py, src/absump/ingest/statcast_day.py, tests/data/test_statcast_minors.py, logs/evidence/W2.10-aaa-complete.json


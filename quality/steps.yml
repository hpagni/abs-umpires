# W7.1, the prose linter and its self-test. Owner W7, fleet phase 04. SOP W7.1..W7.5
# cluster and section 2.8: one implementation at quality/prose_lint.py of W7.2 rules 1
# to 11 and the ban list, WR-01..WR-08, and the P8 ban list on docs/p8/**. Rule 6 and
# WR-07 stay with quality/check_numbers.py, the one number gate.
#
# The verify command runs the self-test: 53 fixture cases, each of the 19 checks
# tripped by at least one; the command line end to end on a temporary tree; the ban
# file parser; and, when the private sop/SOP-final.md is on disk, the built-in ban
# list, P8 list, thresholds and strings compared with the SOP text. It then prints the
# rule table and scans the default scope, and passes only if the scan completes and
# prints its summary. The scan's own exit code is not this gate: W7.5 wires
# `make lint-prose`, and the corpus held 156 violations over 15 files at registration.
# Mutation-tested 2026-09-25: 24 planted faults, each exits 1.
# Measured 2026-09-25: exit 0 in about 1 s.
#
# The SOP gives W7.1, W7.3, W7.4 and W7.5 no standalone paragraphs. This row is the
# slice W7.1 built, quality/prose_lint.py. The other three ids register their own rows.

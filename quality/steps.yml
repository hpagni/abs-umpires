# W6.0 is the Statcast backfill, SOP section W6.0: src/absump/ingest/pull_statcast.py,
# 2022 to the 2026-09-21 cutoff, ordered newest first, idempotent, skipping any day already
# cached non-empty. It is registered here so that `make prove` reports it MISSING until the
# puller exists, rather than leaving a scheduled two-night pull off the board entirely.
# The verify command must stay offline: --plan issues no request, prints the day list the
# backfill would pull, and exits non-zero if that list crosses the 2026-09-21 cutoff, which
# is the seal. W6 may narrow this command when it builds the step; it may not widen it into
# something that pulls.

- id: W6.0
  title: "Statcast backfill, 2022 to the 2026-09-21 cutoff, resumable"
  verify: "uv run --locked python -m absump.ingest.pull_statcast --plan --through 2026-09-21"
  expect_exit: 0
  owner: W6
  needs: src/absump/ingest/pull_statcast.py, config/throttle.yml


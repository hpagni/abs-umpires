#
# PLACEHOLDER. Written by W9.7 in fleet phase 01, 2026-09-23 05:13 CEST. It carries no hash
# line yet, because PREREGISTRATION.md does not exist yet and the tag prereg-v1
# has not been cut. Phase 04 owns both: it writes PREREGISTRATION.md, tags
# prereg-v1, pushes the tag, and replaces this file wholesale with the output of
#
#     shasum -a 256 PREREGISTRATION.md <each annex>
#
# one "<sha256>  <path>" line per file, PREREGISTRATION.md among them.
#
# HOW IT IS READ. absump.seal._prereg_hash_matches() re-hashes each named path
# from the tagged blob, git show prereg-v1:<path>, never from the worktree, so
# an edit made after the tag cannot satisfy the lock. While this file holds no
# hash line, that function returns False, _unlocked() returns False, and the
# seal stays shut. That is the intended state for every phase before 04.
#
# Do not add a line here by hand. The lock is generated from the tagged blobs.

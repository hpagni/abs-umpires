# W3.21, placebos P1 to P4. Owner W3, fleet phase 05, the ch1-fits lane.
#
# R/ch1/26_placebos.R scores P1 as two one-sided equivalence tests on W3.15's draws (0.5 pp, 3 sq
# in, 90% intervals, no zero-coverage clause), fits the five All-Star-break false boundaries for P2,
# and tabulates P4 with Wilson intervals. P3 is written as not run: it needs the AAA arm, which is
# out of the sprint. If P1 or P2 fails, T5 reads "descriptive" and W6.7 drops the causal wording.
#
# Every real-data entry point refuses to run unless `git merge-base --is-ancestor prereg-v1 HEAD`
# succeeds, origin carries the tag (D-67), and the fit code is committed (GD-12), and writes a
# provenance receipt under out/models/. The verify command re-reads what the step wrote with
# tests/ch1/check_ch1_outputs.R --step W3.21 and refits nothing; GD-04 then scans the script.
# `needs` names the step's outputs, which exist only after the post-tag run, so before it the step
# reads MISSING rather than FAIL. The dry run on a synthetic table is
# tests/model/test_mt_ch1_sprint.py.
- id: W3.21
  title: "Chapter 1 placebos P1 to P4"
  verify: "Rscript tests/ch1/check_ch1_outputs.R --out out --step W3.21 && uv run --locked python tests/guard/gd04_scan.py --path R/ch1/26_placebos.R"
  expect_exit: 0
  owner: W3
  needs: R/ch1/26_placebos.R, out/ch1/tab/T5_placebos.csv

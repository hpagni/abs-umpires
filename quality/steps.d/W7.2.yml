# W7.2, the writing checklist and the ban list. Owner W7, fleet phase 04. SOP W7.2.
# docs/writing-checklist.md states the eleven numbered rules and the two R2 rules,
# WR-20 and WR-19. Each rule names the check that enforces it and the finding label
# that check prints. quality/banned.txt is the SOP ban list entry for entry and in the
# SOP's order: 74 entries for every file and 9 under [p8] for docs/p8/**.
#
# The verify command runs quality/prose_lint.py, ops/lint_prose.sh (the current
# `make lint-prose`) and quality/check_numbers.py on the checklist. It then checks that
# the ban file equals the linter's SOP floor in order and scope, and equals the SOP
# paragraph when the private sop/SOP-final.md is on disk; that rules 1 to 11 each name
# a real check, flag and label; that 16 SOP literals are present; WR-20 over its SOP
# scope (abstract/, PREREGISTRATION.md, docs/prior-art.md, docs/memo/, docs/ch1.md)
# plus the checklist; and WR-19 on both files and any file the checklist links to.
# WR-20 runs here because quality/prose_lint.py does not carry it at registration.
# Mutation-tested 2026-09-25: 24 planted faults, each exits 1. With sop/ absent, as in
# a clean clone, it exits 0 and says the SOP comparison was skipped.
# Measured 2026-09-25: exit 0 in about 0.3 s.
#
# Amended 2026-09-25, fleet phase 04 run 5, small-gates lane:
# lane's, fleet phase 04 (run 5).
#
# The verifier (logs/evidence/W7.2.verify-prereg.log) refuted the previous verify: its
# WR-20 scan split sentences on its own, so six in-scope mutants passed (unpunctuated
# bullets, a closing quote, &#160; and &#xA0;, a heading, an HTML paragraph), and it
# read PREREGISTRATION.md but not docs/prereg/. The original command is unchanged; it
# is followed by quality/checks/wr20.py (W7.4) over its default scope, the five SOP
# paths plus docs/prereg/, which is how checklist rule 2 defines the pre-registration.
# Replayed 2026-09-25 on the verifier's mutant trees: M1 to M10 each exit 1, C0 exits 0.

- id: W7.2
  title: "The writing checklist and the ban list"
  verify: 'uv run --locked python quality/prose_lint.py docs/writing-checklist.md && ABS_PROSE_FILES=docs/writing-checklist.md bash ops/lint_prose.sh && uv run --locked python quality/check_numbers.py docs/writing-checklist.md && uv run --locked python -c ''import re, os, sys; sys.path.insert(0, "quality"); import prose_lint as L; F = lambda c, m: c or sys.exit("W7.2 FAIL: " + m); rd = lambda p: open(p, encoding="utf-8").read(); t, b = rd("docs/writing-checklist.md"), rd("quality/banned.txt"); R = [x.strip() for x in b.split("\n") if x.strip() and not x.strip().startswith("#")]; F(R.count("[p8]") == 1 and "[all]" not in R, "quality/banned.txt needs exactly one [p8] line and no [all] line"); k = R.index("[p8]"); A, Q = R[:k], R[k + 1:]; F(A == list(L.SOP_BAN), "the general ban list differs from SOP W7.2: missing %s, extra %s, or out of order" % ([x for x in L.SOP_BAN if x not in A], [x for x in A if x not in L.SOP_BAN])); F(Q == list(L.SOP_BAN_P8), "the [p8] ban list differs from SOP W7.2: missing %s, extra %s, or out of order" % ([x for x in L.SOP_BAN_P8 if x not in Q], [x for x in Q if x not in L.SOP_BAN_P8])); bans, notes = L.parse_ban_file(b); F(not notes and bans == L.floor_bans(), "the linter reads quality/banned.txt differently from its SOP floor: " + "; ".join(notes)); S = "sop/SOP-final.md"; sop = os.path.isfile(S); s = rd(S) if sop else ""; m = re.search(r"^\*\*Ban list\*\* \([^)]*\): (.*?)\. P8-only additions applied to `docs/p8/\*\*`: (.*?)\.$", s, re.M); F(not sop or m, "the Ban list paragraph is not in sop/SOP-final.md"); F(not sop or (A == [x.strip() for x in m.group(1).split(",")] and Q == [re.sub(r"^and ", "", x.strip()).replace("`", "") for x in m.group(2).split(",")]), "quality/banned.txt differs from the Ban list paragraph of sop/SOP-final.md"); N = re.findall(r"^(\d+)\. (.*)$", t, re.M); F([int(n) for n, _ in N] == list(range(1, 12)), "the checklist needs eleven numbered rules, 1 to 11, and has %s" % [n for n, _ in N]); C = [re.search(r"Check: `quality/(prose_lint|check_numbers)\.py( --ship)?`, label `([^`]+)`", r) for _, r in N]; F(all(C), "rules with no named check: %s" % [i + 1 for i, c in enumerate(C) if not c]); ok = lambda k, c: (c.group(1) == "check_numbers" and c.group(3) == "WR-07" and c.group(2) is None and "WR-07" in rd("quality/check_numbers.py")) if k == 6 else (c.group(1) == "prose_lint" and c.group(3) in L.LABELS.values() and c.group(3).split(",")[0] == "rule %d" % k and bool(c.group(2)) == (k in (8, 9, 11))); F(all(ok(i + 1, c) for i, c in enumerate(C)) and "label `P8 ban list`" in N[2][1] and "P8 ban list" in L.LABELS.values(), "a rule names a check, a flag or a label the tools do not have: %s" % [i + 1 for i, c in enumerate(C) if not ok(i + 1, c)]); W = ["abstract/", "PREREGISTRATION.md", "docs/prior-art.md", "docs/memo/", "docs/ch1.md"]; WS = ", ".join("`%s`" % w for w in W[:-1]) + " and `%s`" % W[-1]; R20 = "any sentence containing \"buffer\" and \"two inches\" must also contain \"outside\""; V = ["\u2264%d words, file median \u2264%d" % (L.MAX_WORDS_RULE1, L.MAX_MEDIAN_RULE1), "sentence over %d words" % L.MAX_WORDS_WR03, "above %d%%" % round(100 * L.MAX_PASSIVE_WR08), "`" + L.ATTRIBUTION + "`", "`U+2014`", "`Q1.` to `Qn.` or `H1.` to `Hn.`", "`95%`, `90%`, `[`, `\u00b1` or `n = `", "`lit/04`, `lit/06`, `lit/22` and `METHODS_REVIEW` item `B5`", re.sub(r"are \w+(?=\x27s;)", "are [owner]", L.DIRECTION), "no file reachable from the repository root may name the author", WS] + list(L.PRIOR_ART_TOKENS); F(all(v in t for v in V) and R20 in t.lower(), "SOP literals missing from the checklist: %s" % [v for v in V + [R20] if v not in t and v != R20 or v == R20 and R20 not in t.lower()]); F(not sop or all(v in s for v in (V[0], "WR-03 " + V[1], "density " + V[2], V[3], R20, "applied to " + WS, "(WR-19)", "(WR-20)")), "a checklist literal or the WR-20 scope differs from sop/SOP-final.md"); X = sorted({p for p in W + ["docs/writing-checklist.md"] if os.path.isfile(p)} | {os.path.join(d, f) for w in W if os.path.isdir(w) for d, _, fs in os.walk(w) for f in fs if f.lower().endswith((".md", ".html", ".htm", ".txt", ".tex", ".qmd", ".rmd"))}); T = [(p, x) for p in X for x in re.split(r"(?<=[.!?])\s+|\n\s*\n", re.sub(r"<[^>]+>", " ", rd(p)) if p.endswith(("html", "htm")) else rd(p)) if re.search(r"buffer", x, re.I) and re.search(r"two(?:\s|&nbsp;|\u00a0)+inches", x, re.I)]; B = [(p, " ".join(x.split())[:120]) for p, x in T if not re.search(r"outside", x, re.I)]; F(not B, "WR-20: %d sentence(s) contain buffer and two inches but not outside: %s" % (len(B), B)); AU = r"hudson|pagni|hudpag|\bucla\b"; lk = [os.path.normpath(os.path.join("docs", x)) for x in re.findall(r"\]\(([^)\s#]+)", t) if not re.match(r"[a-z]+:", x)]; F(not re.search(AU, t + b, re.I) and not [x for x in lk if os.path.isfile(x) and re.search(AU, rd(x), re.I)], "WR-19: the checklist, the ban file or a file the checklist links to names the author"); print("W7.2 OK: quality/banned.txt holds %d entries and %d P8 entries, equal to SOP W7.2 %s; %d numbered rules, each naming a check and a finding label the tools print; %d SOP literals present; WR-20 over %d files, %d sentences with buffer and two inches, 0 without outside; WR-19 0 author strings in 2 files and %d linked files" % (len(A), len(Q), "and to sop/SOP-final.md" if sop else "(sop/SOP-final.md absent, compared with the linter floor only)", len(N), len(V) + 1, len(X), len(T), len(lk)))'' && uv run --locked python quality/checks/wr20.py'
  expect_exit: 0
  owner: W7
  needs: docs/writing-checklist.md, quality/banned.txt, quality/prose_lint.py, quality/check_numbers.py, ops/lint_prose.sh, quality/checks/wr20.py

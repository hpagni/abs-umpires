# W3.11, specification development on 2022-2024 only. Owner W3, fleet phase 04.
#
# R/ch1/20_spec_dev.R --check reloads the development sample (P0 in 2022-2024
# with |d| <= 8.0 in) through the script's one filtered read and asserts that no
# 2025 or 2026 row arrived. The build's record holds 687,496 rows, from before
# D-P4-08, and D-P4-08 took 11 of them out of the table, so the build cannot be
# refitted. Since 2026-09-29 the check follows DEV-68's disclosure: it asserts the
# record's 687,496 rows, the table's 687,485 under the single offset, and the
# k.check table of docs/prereg/ch1.md against the record. It then refits the frozen
# specification and the rung above it under D-P4-04 (sample d8nc, 687,366 rows),
# two bam fits in parallel, about 10 minutes and 3.9 GB peak, and fails unless both
# reproduce the --check-noncohort record in out/dev/ch1_spec/noncohort/, no k-index
# moves by 0.01 or more between the two rungs, and docs/prereg/ch1.md carries the
# same k values, the three counts, DEV-68, the 2022-2024 disclosure, both CH1-A5
# tolerances and the single-thread record. It prints one DISCLOSED line with the
# three counts. GD-04 then scans the script. `needs` names the analysis table and
# the out/dev files, which never enter git, so a clean clone reads MISSING rather
# than FAIL. docs/prereg/ch1.md section 1.2 says why W3.11 was not rebuilt.
- id: W3.11
  title: "Specification development on 2022-2024 only, k frozen, binned-logistic tolerance stated"
  verify: "Rscript R/ch1/20_spec_dev.R --check && uv run --locked python tests/guard/gd04_scan.py --path R/ch1/20_spec_dev.R"
  expect_exit: 0
  owner: W3
  needs: R/ch1/20_spec_dev.R, docs/prereg/ch1.md, data/marts/ch1_called.parquet, out/dev/ch1_spec/frozen_spec.json, out/dev/ch1_spec/k_sweep.csv, out/dev/ch1_spec/noncohort/fits/k24-18-12-10_ord_d8nc.json, out/dev/ch1_spec/noncohort/fits/k32-24-16-20_ord_d8nc.json

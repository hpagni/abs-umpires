# W3.16, the three-regime decomposition. Owner W3, fleet phase 05, the ch1-fits lane.
#
# R/ch1/23_decomposition.R computes g, the precision-weighted 2022-2024 slope, and delta_buffer,
# delta_abs and delta_total on W3.15's joint draws, with the identity residual as a column and
# share_abs only under CH1-A9's rule. Beside the primary: the ABS-measured arm and D-P4-04's sign
# agreement, the CH1-A14 panel, the CH1-A5 binned logistic, and SENS-B1-UNDERSMOOTH's top edge
# (annex 8.7), and annex 8.7's unmet recovery clauses beside the top edge and the half-width
# (D-R0-04). Its headline row is descriptive.
#
# Every real-data entry point refuses to run unless `git merge-base --is-ancestor prereg-v1 HEAD`
# succeeds, origin carries the tag (D-67), and the fit code is committed (GD-12), and writes a
# provenance receipt under out/models/. The verify command re-reads what the step wrote with
# tests/ch1/check_ch1_outputs.R --step W3.16 and refits nothing; GD-04 then scans the script.
# `needs` names the step's outputs, which exist only after the post-tag run, so before it the step
# reads MISSING rather than FAIL. The dry run on a synthetic table is
# tests/model/test_mt_ch1_sprint.py.
- id: W3.16
  title: "Chapter 1 three-regime decomposition: buffer, ABS and the 2022-2024 pre-trend"
  verify: "Rscript tests/ch1/check_ch1_outputs.R --out out --step W3.16 && uv run --locked python tests/guard/gd04_scan.py --path R/ch1/23_decomposition.R"
  expect_exit: 0
  owner: W3
  needs: R/ch1/23_decomposition.R, out/ch1/tab/T4_decomposition.csv, out/tables/headline.csv

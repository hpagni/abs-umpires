# W3.3, the zone and kinematics module. Owner W3, fleet phase 04.
#
# The module is R/lib/zone.R, shared with W4 and W5, and its Python twin
# src/absump/geometry.py. The verify command is the acceptance test itself,
# tests/ch1/test_zone.R, which prints one line per clause and exits 1 after
# reporting every clause that failed. 43 assertions, about 4 s.
#
# It owns UT-11 (the smaller positive root in closed form: the round trip, the
# t range at both planes, t_mid > t_front, dz < 0 where the ball is still
# falling, and the closed form against a brute-force bisection over every
# pitch), UT-12 (the twin raises ValueError on release_pos_*, as a plane and as
# a named column), UT-13 (sz_top*12/0.535 == sz_bot*12/0.27, over ABS games on
# every open 2026 day), the D-14 edge convention against four hand-computed
# points, the 2026 plane clauses against the Stats API over every open 2026
# day, the 2025 plane clause, mean dz on a day per season 2022-2025, the
# 500-pitch golden file, whose shape is asserted before it is compared, and the
# 100,000-row cross-check between the R module and the twin.
#
# One clause is deferred in the test's own output, with its reason, rather
# than passed: the AAA-2024 plane identification needs AAA pitch-level CSV, and
# data/interim/statcast_pitch holds level=mlb only (DEV-25, DEV-27). The 2025
# clause reads the one raw 2025 feed on disk, game 776311, and defers with a
# reason if that file is absent.
#
# `needs` names the module, the twin, the golden file and data/interim. The
# data directory never enters git, so on a clean clone the step reads MISSING
# rather than FAIL, which is the same treatment W3.2 gives the warehouse.

- id: W3.3
  title: "The zone and kinematics module, UT-11 UT-12 UT-13 and the golden file"
  verify: "Rscript tests/ch1/test_zone.R"
  expect_exit: 0
  owner: W3
  needs: R/lib/zone.R, src/absump/geometry.py, tests/golden/reproject_golden.csv, data/interim

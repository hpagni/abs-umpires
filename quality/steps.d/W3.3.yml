# W3.3, the zone and kinematics module. Owner W3, fleet phase 04.
#
# The module is R/lib/zone.R, shared with W4 and W5, and its Python twin
# src/absump/geometry.py. The verify command is the acceptance test itself,
# tests/ch1/test_zone.R, which prints one line per clause and exits 1 after
# reporting every clause that failed. 36 assertions, 1.5 s.
#
# It owns UT-11 (the smaller positive root in closed form: the round trip, the
# t range at both planes, t_mid > t_front, dz < 0 where the ball is still
# falling, and the closed form against a brute-force bisection), UT-12 (the
# twin raises ValueError on release_pos_*), UT-13 (sz_top*12/0.535 ==
# sz_bot*12/0.27), the D-14 edge convention against four hand-computed points,
# the 2026 plane clauses against the Stats API, mean dz on a day per season
# 2022-2025, the 500-pitch golden file and the 100,000-row cross-check between
# the R module and the twin.
#
# Two clauses are deferred in the test's own output, with their reasons, rather
# than passed: the 2025 and AAA-2024 plane identifications need the Stats API
# side for those seasons, and data/interim/feed_pitch holds season=2026 only
# while data/interim/statcast_pitch holds level=mlb only (DEV-25, DEV-27).
#
# `needs` names the module, the twin, the golden file and data/interim. The
# data directory never enters git, so on a clean clone the step reads MISSING
# rather than FAIL, which is the same treatment W3.2 gives the warehouse.

- id: W3.3
  title: "The zone and kinematics module, UT-11 UT-12 UT-13 and the golden file"
  verify: "Rscript tests/ch1/test_zone.R"
  expect_exit: 0
  owner: W3
  needs: R/lib/zone.R, src/absump/geometry.py, tests/golden/reproject_golden.csv, data/interim

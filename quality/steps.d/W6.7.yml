# W6.7, the Chapter 1 result for the abstract. Owner W6, fleet phase 05, the ch1-fits lane.
#
# R/ch1/27_abstract_ch1.R writes D_BUF, D_ABS, D_PRE, D_PLANE_TOP, D_PLANE_BOT, A_CORR and A_PUB from
# committed CSVs, each with its 95% interval and source row, and N_CHAL, the Methods sentence's
# count of challenged pitches, from the overall row of W3.8's out/ch1/tab/T2_zone_gate.csv, and
# CH1-A5's area values A5_BUF, A5_ABS and A5_TOL from T4. It writes the pre-registered headline
# sentence and D-P4-04's sign-agreement row, worded from T4's height_cohort_flag, to headline.csv,
# and puts CH1_P1, placebo P1's verdict with T5's numbers, first (PREREGISTRATION.md section 8,
# DEV-77). It regenerates docs/numbers.json with tools/comms/export_numbers.R. CALL and
# BREAK_YEAR stay the owner's.
#
# Every real-data entry point refuses to run unless `git merge-base --is-ancestor prereg-v1 HEAD`
# succeeds, origin carries the tag (D-67), and the fit code is committed (GD-12), and writes a
# provenance receipt under out/models/. The verify command re-reads what the step wrote with
# tests/ch1/check_ch1_outputs.R --step W6.7 and refits nothing; GD-04 then scans the script.
# `needs` names the step's outputs, which exist only after the post-tag run, so before it the step
# reads MISSING rather than FAIL. The dry run on a synthetic table is
# tests/model/test_mt_ch1_sprint.py.
- id: W6.7
  title: "Chapter 1 abstract slots and result sentence, carried to docs/numbers.json"
  verify: "Rscript tests/ch1/check_ch1_outputs.R --out out --step W6.7 && uv run --locked python tests/guard/gd04_scan.py --path R/ch1/27_abstract_ch1.R"
  expect_exit: 0
  owner: W6
  needs: R/ch1/27_abstract_ch1.R, tools/comms/export_numbers.R, out/tables/abstract_slots_ch1.csv

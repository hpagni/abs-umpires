# .github/workflows/seal-guard.yml -- SOP steps W1.16 and W9.10.
#
# Parked at ops/ci-pending/seal-guard.yml until the gh token carries the `workflow`
# scope; ops/ci-pending/README.md is the owner's one move.
#
# The sealed guard, in CI, on push and on pull request. SOP W1.16, verbatim: it
# "runs the checks in W9.7 layers 3 and 4, plus: the tag `prereg-v1` exists and
# `PREREGISTRATION.md` still matches `quality/prereg.lock`; any file under
# `out/sealed/` has a sibling `provenance.json` carrying `prereg_tag`, the tag's
# commit SHA, `fit_started_at` and `input_max_game_date`; no `provenance.json` has
# `fit_started_at` earlier than the tag's commit date."
#
# Layer 3 is the static scan (GD-04, GD-05), tests/guard/test_no_sealed_reads.py.
# Layer 4 is the receipts (GD-01, GD-02), tests/guard/test_seal_receipts.py. Both
# are pure git and file scans. This workflow reads no data.
#
# prereg-v1 was cut in SOP W3.13 and is on the remote, so a missing tag is a hard
# failure here, never a skip. There is no continue-on-error anywhere in this file.
#
# Zero network calls to MLB hosts: the same arm and audit steps as ci.yml, from
# ops/ci_no_mlb.sh; see the header of ci.yml for how that is enforced.
#
# ops/ci_check.py runs the provenance step below, byte for byte, against a clean
# clone of HEAD and against planted violations, so this check has failed where it
# should before any runner ran it.

name: seal-guard

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: seal-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  seal-guard:
    name: seal-guard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The guard reads history, tags and tag commit dates. A shallow clone
          # would let a missing tag look like a passing check.
          fetch-depth: 0
          fetch-tags: true

      - name: no MLB host, arm (sinkhole and resolver observer)
        run: bash ops/ci_no_mlb.sh arm

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync --locked
        run: uv sync --locked

      - name: W9.7 layer 3, the static scan (GD-04, GD-05)
        run: uv run --locked pytest tests/guard/test_no_sealed_reads.py -q

      - name: W9.7 layer 4, the receipts (GD-01, GD-02)
        run: uv run --locked pytest tests/guard/test_seal_receipts.py -q

      - name: pre-registration tag and sealed provenance
        run: |
          set -eu
          uv run --locked python - <<'PY'
          """W1.16 seal-guard: the pre-registration tag, the lock, and sealed provenance.

          The four checks are the SOP's four clauses, in order:
            1. the tag prereg-v1 exists;
            2. PREREGISTRATION.md still matches quality/prereg.lock;
            3. every file under out/sealed/ has a sibling provenance.json carrying
               prereg_tag, the tag's commit SHA, fit_started_at and input_max_game_date;
            4. no provenance.json anywhere in the tree has fit_started_at earlier than
               the tag's commit date. A fit_started_at that is present and cannot be
               read as a timestamp fails too, since it cannot be shown not to be
               earlier. A provenance.json outside out/sealed/ that carries no
               fit_started_at has nothing for clause 4 to compare; it is listed as a
               NOTE so the gap stays visible, and clause 3 is what requires the field
               wherever a sealed output lives.
          """
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import sys
          from datetime import datetime

          TAG = "prereg-v1"
          ROOT = pathlib.Path.cwd()
          SHA_KEYS = ("prereg_commit", "prereg_sha", "prereg_commit_sha", "prereg_tag_sha")
          SKIP_NAMES = {".gitkeep", "provenance.json"}
          PRUNE = {".git", ".venv", "node_modules", "renv", "dbt_packages"}

          failures: list[str] = []
          notes: list[str] = []


          def git(*args: str) -> subprocess.CompletedProcess:
              return subprocess.run(
                  ["git", *args], cwd=ROOT, capture_output=True, text=True, check=False
              )


          def rel(p: pathlib.Path) -> str:
              return str(p.relative_to(ROOT))


          def sealed_files() -> list[pathlib.Path]:
              d = ROOT / "out" / "sealed"
              if not d.is_dir():
                  return []
              return sorted(p for p in d.rglob("*") if p.is_file() and p.name not in SKIP_NAMES)


          def provenance_files() -> list[pathlib.Path]:
              found = []
              for p in ROOT.rglob("provenance.json"):
                  if p.is_file() and not PRUNE.intersection(p.relative_to(ROOT).parts):
                      found.append(p)
              return sorted(found)


          def as_dt(text: str) -> datetime | None:
              try:
                  dt = datetime.fromisoformat(text.strip().replace("Z", "+00:00"))
              except (ValueError, AttributeError):
                  return None
              # a naive stamp cannot be ordered against the tag's zoned commit date
              return dt if dt.tzinfo is not None else None


          # ---------------------------------------------------------- 1. the tag
          if git("rev-parse", "-q", "--verify", f"refs/tags/{TAG}").returncode != 0:
              print(f"SEAL-GUARD FAIL: the tag {TAG} does not exist in this checkout.")
              print("It was cut in SOP W3.13; every sealed-side guarantee is anchored to it.")
              sys.exit(1)
          tag_sha = git("rev-list", "-n", "1", TAG).stdout.strip()
          tag_date_raw = git("log", "-1", "--format=%cI", tag_sha).stdout.strip()
          tag_date = as_dt(tag_date_raw)
          print(f"1. {TAG} exists -> {tag_sha}, committed {tag_date_raw}")
          if tag_date is None:
              failures.append(f"could not read the commit date of {TAG}: {tag_date_raw!r}")

          # ------------------------------------ 2. PREREGISTRATION.md vs prereg.lock
          prereg = ROOT / "PREREGISTRATION.md"
          lock = ROOT / "quality" / "prereg.lock"
          if not prereg.is_file():
              failures.append("PREREGISTRATION.md is absent")
          elif not lock.is_file():
              failures.append("quality/prereg.lock is absent")
          else:
              digest = hashlib.sha256(prereg.read_bytes()).hexdigest()
              locked = None
              for line in lock.read_text(encoding="utf-8").splitlines():
                  m = re.match(r"^([0-9a-f]{64})\s+\*?PREREGISTRATION\.md\s*$", line.strip())
                  if m:
                      locked = m.group(1)
                      break
              if locked is None:
                  failures.append("quality/prereg.lock has no sha256 line for PREREGISTRATION.md")
              elif locked != digest:
                  failures.append(
                      "PREREGISTRATION.md no longer matches quality/prereg.lock: "
                      f"file {digest}, lock {locked}"
                  )
              else:
                  print(f"2. PREREGISTRATION.md matches quality/prereg.lock ({digest[:12]})")

          # ------------------------------------ 3. sibling provenance for sealed output
          sealed = sealed_files()
          for path in sealed:
              sidecar = path.parent / "provenance.json"
              if not sidecar.is_file():
                  failures.append(f"{rel(path)} has no sibling provenance.json")
                  continue
              try:
                  meta = json.loads(sidecar.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  failures.append(f"{rel(sidecar)} is not readable JSON: {exc}")
                  continue
              if meta.get("prereg_tag") != TAG:
                  failures.append(
                      f"{rel(sidecar)}: prereg_tag is {meta.get('prereg_tag')!r}, expected {TAG!r}"
                  )
              found_sha = next((meta[k] for k in SHA_KEYS if k in meta), None)
              if found_sha is None:
                  failures.append(f"{rel(sidecar)}: no tag commit SHA under any of {SHA_KEYS}")
              elif str(found_sha) != tag_sha:
                  failures.append(f"{rel(sidecar)}: tag commit SHA is {found_sha}, expected {tag_sha}")
              for key in ("fit_started_at", "input_max_game_date"):
                  if not str(meta.get(key) or "").strip():
                      failures.append(f"{rel(sidecar)}: {key} is missing or empty")
          print(f"3. out/sealed/: {len(sealed)} sealed file(s) checked for sibling provenance")

          # ------------------------------------ 4. no fit started before the tag
          receipts = provenance_files()
          compared = 0
          for sidecar in receipts:
              try:
                  meta = json.loads(sidecar.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  failures.append(f"{rel(sidecar)} is not readable JSON: {exc}")
                  continue
              raw = meta.get("fit_started_at") if isinstance(meta, dict) else None
              if raw is None or not str(raw).strip():
                  notes.append(rel(sidecar))
                  continue
              started = as_dt(str(raw))
              if started is None:
                  failures.append(f"{rel(sidecar)}: fit_started_at {raw!r} is not a zoned ISO 8601 time")
                  continue
              compared += 1
              if tag_date is not None and started < tag_date:
                  failures.append(
                      f"{rel(sidecar)}: fit_started_at {started.isoformat()} is earlier than the "
                      f"{TAG} commit date {tag_date.isoformat()}"
                  )
          print(
              f"4. {len(receipts)} provenance.json file(s): {compared} carry fit_started_at and were "
              f"compared with the tag date, {len(notes)} carry none"
          )
          for n in notes:
              print(f"   NOTE no fit_started_at, nothing to compare: {n}")

          if failures:
              print(f"SEAL-GUARD FAIL: {len(failures)} problem(s)")
              for line in failures:
                  print(f"  {line}")
              sys.exit(1)

          print(
              f"SEAL-GUARD PASS: {TAG} at {tag_sha[:12]}, lock matches, {len(sealed)} sealed "
              f"file(s), {compared} fit start(s) on or after the tag"
          )
          PY

      - name: no MLB host, audit
        if: always()
        run: bash ops/ci_no_mlb.sh audit

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: no-mlb-dns-seal-guard
          path: ${{ runner.temp }}/ci-no-mlb/dns.log
          retention-days: 7
          if-no-files-found: warn

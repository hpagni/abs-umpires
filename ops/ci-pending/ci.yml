# .github/workflows/ci.yml -- SOP steps W1.16 and W9.10.
#
# Parked at ops/ci-pending/ci.yml until the gh token carries the `workflow` scope;
# ops/ci-pending/README.md is the owner's one move. Nothing in it is provisional.
#
# Six parallel jobs on ubuntu-latest, on push and on pull request: lint, python, r,
# dbt, guard, secrets. No job `needs` another, so the workflow's wall clock is its
# slowest job. Budget: the whole workflow under 8 minutes (SOP clause 3, risk R-14),
# and every job carries timeout-minutes: 8, so a job that creeps past the budget
# goes red instead of quietly eating it. `make test-model` (30 to 70 minutes) is
# deliberately outside this gate. Every job is free on a public repository.
#
# ZERO NETWORK CALLS TO MLB HOSTS FROM ANY RUNNER (SOP clause 3). CI sees the
# synthetic fixtures in tests/fixtures and the fixture DuckDB built from them, and
# nothing else. Enforced, not trusted, in every job:
#   - the first step after checkout is `ops/ci_no_mlb.sh arm`. It sinkholes every
#     MLB-family host the repository names in /etc/hosts, so no packet can leave for
#     one, and starts an observer on the runner's resolver that is proved live by a
#     canary lookup before the job's own steps run;
#   - the last step is `ops/ci_no_mlb.sh audit`, under if: always(). It fails the job
#     if any name in the MLB family that script defines (seven registrable domains
#     and every subdomain of each) was looked up, or if the sinkhole was removed;
#   - the observer log is uploaded as the job's no-mlb-dns artifact, so the claim is
#     checkable after the fact;
#   - ops/ci_check.py fails if a tracked file names an MLB-family host missing from
#     the sinkhole list, or if this file names one at all.
# The outbound requests this file does make are toolchain installs: GitHub, PyPI via
# uv, the Posit package manager and r-universe for R binaries, and the gitleaks
# release. None is a data pull, and none is an MLB or Savant host.
#
# Actions are pinned: actions/checkout@v7.0.1, astral-sh/setup-uv@v10.2.0,
# actions/cache@v6.1.0, actions/upload-artifact@v7.0.1, r-lib/actions/setup-r@v2.
# ops/ci_check.py rejects any other `uses:`.
#
# R-31. CI runs on Linux and never exercises the arm64 macOS build. A green run here
# is not a reproduction; `make prove` on the Mac is the authoritative gate.
#
# There is no nightly.yml. The nightly is local launchd at 03:30 Europe/Madrid (SOP
# section 2.8, D-08), and no keepalive commit is ever added. docs/runbook.md records
# the 60-day disablement rule that would apply to any Actions cron added later.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  R_VERSION: "4.5.2"
  GITLEAKS_VERSION: "8.30.1"

jobs:

  # ---------------------------------------------------------------- lint
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # full history: the prose lint runs on the .md files this push or pull
          # request changed, which needs the merge base on disk.
          fetch-depth: 0

      - name: no MLB host, arm (sinkhole and resolver observer)
        run: bash ops/ci_no_mlb.sh arm

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync --locked
        run: uv sync --locked

      - name: ruff check .
        run: uv run --locked ruff check .

      - name: ruff format --check .
        run: uv run --locked ruff format --check .

      - name: ops/lint_http.sh
        run: bash ops/lint_http.sh

      - name: ops/hook_no_raw_data.sh
        # --tracked: a runner stages nothing, so the hook reads the commit's whole
        # index instead of an empty staged list.
        run: bash ops/hook_no_raw_data.sh --tracked

      - name: make lint-prose on changed .md
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
            base="origin/$BASE_REF"
            git rev-parse -q --verify "$base" >/dev/null || base=FETCH_HEAD
            changed=$(git diff --name-only --diff-filter=ACMR "$base...HEAD" -- '*.md')
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "$zero" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only --diff-filter=ACMR "$BEFORE_SHA" HEAD -- '*.md')
          elif git rev-parse -q --verify "origin/$DEFAULT_BRANCH" >/dev/null \
            && mb=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD) \
            && [ "$mb" != "$(git rev-parse HEAD)" ]; then
            # first push of a new branch: what it changed against the default branch.
            changed=$(git diff --name-only --diff-filter=ACMR "$mb" HEAD -- '*.md')
          else
            # first push of the default branch, or a history with no common base.
            changed=$(git ls-files -- '*.md')
          fi
          if [ -z "$changed" ]; then
            echo "no .md changed in this event; prose lint skipped"
            exit 0
          fi
          echo "$changed"
          # quality/prose_lint.py (SOP W9.13) reads ABS_PROSE_FILES, one path per line,
          # and skips a listed path that no longer exists as a deletion.
          ABS_PROSE_FILES="$changed" make lint-prose

      - name: no MLB host, audit
        if: always()
        run: bash ops/ci_no_mlb.sh audit

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: no-mlb-dns-lint
          path: ${{ runner.temp }}/ci-no-mlb/dns.log
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------- python
  # The SOP's pytest line runs unchanged. Three prerequisites make it runnable on a
  # fresh runner; without them a clean clone of HEAD fails it on this Mac (W9.10
  # rehearsal, ops/ci_rehearse.py, 2026-09-30):
  #   - PYTHONPATH carries tests/guard. Under -n 4 the xdist controller re-imports the
  #     module that defines a warning's class to rebuild the warning a worker sent it;
  #     tests/guard/test_seal_immutability.py defines VacuousGuard, which it raises on
  #     a runner because the seal there is empty, and the controller, which never
  #     collected tests/guard, dies with INTERNALERROR (exit 3) on the import.
  #   - R 4.5.2 with the renv library. tests/unit crosses the R seam: RP-05
  #     (test_arrow_seam.py), the R HTTP client (test_http_etiquette.py) and the
  #     abstract ledger renderers call Rscript and fail by design when it is absent.
  #     The renv cache is the r job's own key, so the two jobs share one restore.
  #   - the git hooks, installed the way ops/bootstrap.sh installs them (steps 3 and
  #     4): tests/unit/test_layout.py asserts the W2.1 guard and the preserved W1.13
  #     framework hook in .git/hooks, which a fresh clone does not have.
  # No Stan compile here either: nothing installs CmdStan and nothing fits a model.
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/tests/guard
      RENV_PATHS_ROOT: /home/runner/.cache/R/renv
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest
      CMDSTANR_NO_VER_CHECK: "true"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # tests/guard walks git history and tags; a shallow clone makes it lie.
          fetch-depth: 0
          fetch-tags: true

      - name: no MLB host, arm (sinkhole and resolver observer)
        run: bash ops/ci_no_mlb.sh arm

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync --locked
        run: uv sync --locked

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - uses: actions/cache@v6.1.0
        with:
          path: /home/runner/.cache/R/renv
          key: renv-${{ runner.os }}-R4.5.2-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-${{ runner.os }}-R4.5.2-

      - name: renv::restore(), the R side of the seam tests
        shell: Rscript {0}
        run: |
          renv::restore(prompt = FALSE)

      - name: git hooks, as ops/bootstrap.sh installs them
        run: |
          set -eu
          uv run --locked pre-commit install
          sh ops/install_git_hooks.sh

      - name: pytest unit, fixtures, guard
        run: uv run --locked pytest tests/unit tests/fixtures tests/guard -q -n 4

      - name: no MLB host, audit
        if: always()
        run: bash ops/ci_no_mlb.sh audit

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: no-mlb-dns-python
          path: ${{ runner.temp }}/ci-no-mlb/dns.log
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------- r
  r:
    name: r
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RENV_PATHS_ROOT: /home/runner/.cache/R/renv
      # .Rprofile pins repos to cloud.r-project.org, which would build all 216
      # packages from source on a runner. The override points renv at the public
      # Posit binaries for the runner's Ubuntu release instead. It changes where
      # the bytes come from, never which versions: renv.lock decides that.
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest
      # NO STAN COMPILE IN THIS JOB. Nothing here installs CmdStan, and no step calls
      # R/00_setup.R, make r-smoke or any model fit. cmdstanr restores as an R package
      # only. ops/ci_check.py fails if a CmdStan install or a model compile appears.
      CMDSTANR_NO_VER_CHECK: "true"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: no MLB host, arm (sinkhole and resolver observer)
        run: bash ops/ci_no_mlb.sh arm

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - uses: actions/cache@v6.1.0
        with:
          path: /home/runner/.cache/R/renv
          key: renv-${{ runner.os }}-R4.5.2-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-${{ runner.os }}-R4.5.2-

      - name: renv::restore()
        shell: Rscript {0}
        run: |
          # renv/activate.R runs from .Rprofile and bootstraps the pinned renv.
          renv::restore(prompt = FALSE)

      - name: testthat::test_dir("tests/testthat")
        shell: Rscript {0}
        run: |
          testthat::test_dir("tests/testthat")

      - name: no MLB host, audit
        if: always()
        run: bash ops/ci_no_mlb.sh audit

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: no-mlb-dns-r
          path: ${{ runner.temp }}/ci-no-mlb/dns.log
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------- dbt
  dbt:
    name: dbt
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # The ci target is in-memory DuckDB over the synthetic seed and a synthetic lake
      # written to the runner's temp directory. Nothing under data/ is read or
      # written, and the working tree's warehouse/ is never opened.
      ABS_DATA_ROOT: ${{ runner.temp }}/ci-lake
      DBT_PROFILES_DIR: ${{ runner.temp }}/dbt-profiles
    steps:
      - uses: actions/checkout@v7.0.1

      - name: no MLB host, arm (sinkhole and resolver observer)
        run: bash ops/ci_no_mlb.sh arm

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync --locked
        run: |
          uv sync --locked
          # the locked environment's bin first, so the dbt line below is the SOP's own.
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: build the fixture DuckDB from synthetic Parquet
        run: |
          set -eu
          uv run --locked python tests/fixtures/synth_feed.py --out tests/fixtures
          mkdir -p "$ABS_DATA_ROOT/interim"
          uv run --locked python - <<'PY'
          """Write the synthetic fixtures out as the Parquet lake the dbt sources read.

          The sources in dbt/models resolve through
          read_parquet('$ABS_DATA_ROOT/interim/{name}/**/*.parquet', hive_partitioning=true),
          and dbt/macros/lake_scan.sql builds a lake table with no file as an empty,
          typed stub. Every row here comes from tests/fixtures/generated, which is
          generated synthetic data with no MLB or Savant content in it.
          """
          import os
          import pathlib

          import duckdb

          root = pathlib.Path(os.environ["ABS_DATA_ROOT"]) / "interim"
          generated = pathlib.Path("tests/fixtures/generated")

          # fixture file -> lake table. The SOP W1.11 source list is the target shape.
          tables = {"statcast_pitch": generated / "statcast.csv"}

          con = duckdb.connect()
          for table, src in tables.items():
              if not src.exists():
                  raise SystemExit(f"fixture missing: {src}")
              out_dir = root / table
              out_dir.mkdir(parents=True, exist_ok=True)
              out = out_dir / "part-0.parquet"
              # Named parameters: DuckDB binds COPY's TO target before the query, so
              # two positional ? swap the paths and the read finds no file (W9.10
              # rehearsal, duckdb 1.5.5).
              con.execute(
                  "COPY (SELECT * FROM read_csv_auto($src, header=true)) "
                  "TO $out (FORMAT PARQUET, COMPRESSION ZSTD)",
                  {"src": str(src), "out": str(out)},
              )
              rows = con.execute("SELECT count(*) FROM read_parquet(?)", [str(out)]).fetchone()[0]
              print(f"{table}: {rows} rows -> {out}")
          PY

      - name: profiles.yml for the ci target
        run: |
          set -eu
          mkdir -p "$DBT_PROFILES_DIR"
          cp dbt/profiles.yml.example "$DBT_PROFILES_DIR/profiles.yml"

      - name: dbt deps && dbt parse && dbt build --target ci
        working-directory: dbt
        run: dbt deps && dbt parse && dbt build --target ci

      - name: no MLB host, audit
        if: always()
        run: bash ops/ci_no_mlb.sh audit

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: no-mlb-dns-dbt
          path: ${{ runner.temp }}/ci-no-mlb/dns.log
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------- guard
  # The two make targets run unchanged, with xdist under them. prove-guard-redteam
  # calls `make test-guard` 34 times; serial, that took 15 s + 485 s on a clean clone
  # of HEAD on this Mac, past the 8-minute budget before a runner's slower cores are
  # counted (R-14). With PYTEST_ADDOPTS="-n 4" it took 5 s + 187 s and still caught
  # 34 of 34 plants, because the red team requires the plant's own GD FAIL line and
  # not only a non-zero exit. PYTHONPATH is the python job's xdist repair, for the
  # same VacuousGuard warning.
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTEST_ADDOPTS: "-n 4"
      PYTHONPATH: ${{ github.workspace }}/tests/guard
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The guard is a git and file scan. It reads history and tags, and it
          # reads no data at all.
          fetch-depth: 0
          fetch-tags: true

      - name: no MLB host, arm (sinkhole and resolver observer)
        run: bash ops/ci_no_mlb.sh arm

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync --locked
        run: uv sync --locked

      - name: make test-guard
        run: make test-guard

      - name: make prove-guard-redteam
        run: make prove-guard-redteam

      - name: no MLB host, audit
        if: always()
        run: bash ops/ci_no_mlb.sh audit

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: no-mlb-dns-guard
          path: ${{ runner.temp }}/ci-no-mlb/dns.log
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------- secrets
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # gitleaks scans the full history, so the full history has to be here.
          fetch-depth: 0

      - name: no MLB host, arm (sinkhole and resolver observer)
        run: bash ops/ci_no_mlb.sh arm

      - name: install gitleaks
        env:
          GITLEAKS_VERSION: ${{ env.GITLEAKS_VERSION }}
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location "$url" --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks detect --redact --no-banner
        run: gitleaks detect --redact --no-banner

      - name: no MLB host, audit
        if: always()
        run: bash ops/ci_no_mlb.sh audit

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: no-mlb-dns-secrets
          path: ${{ runner.temp }}/ci-no-mlb/dns.log
          retention-days: 7
          if-no-files-found: warn

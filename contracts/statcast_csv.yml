# contracts/statcast_csv.yml -- the data contract for the Statcast Search daily CSV.
#
# SOP W2.9. One request per game-day against Baseball Savant's Statcast Search
# CSV export. This file is the written form of that step's endpoint contract:
# the URL, the response shape, the traps, and every number the SOP measured.
# src/absump/ingest/statcast_day.py reads it; tests/data/test_statcast_days.py
# asserts it against the raw lake.
#
# Numbers here are measurements, not settings. Each one carries the day it was
# measured on. SOP section 0.5 rule 4: a number that came from an endpoint is
# never hard-coded without the contract line that produced it, and this file is
# that line.

step: W2.9
title: "Statcast MLB daily CSV, 2022-2026, 2026 cut at 2026-09-21"
owner: W2

endpoint:
  host: baseballsavant.mlb.com
  path: /statcast_search/csv
  method: GET
  # The URL the SOP states, parameter for parameter and in this order. hfSea is
  # "{season}|" percent-encoded. game_date_gt and game_date_lt are the same day,
  # so the window is one day inclusive.
  query_order:
    - all
    - type
    - player_type
    - min_pitches
    - min_results
    - group_by
    - sort_col
    - player_event_sort
    - sort_order
    - hfSea
    - game_date_gt
    - game_date_lt
  query_fixed:
    all: "true"
    type: details
    player_type: batter
    min_pitches: "0"
    min_results: "0"
    group_by: name
    sort_col: pitches
    player_event_sort: api_p_release_speed
    sort_order: desc
  # No hfGT parameter. The default URL already includes the postseason:
  # 2025-10-25 returned 224 rows for game_pk 813026, which the schedule confirms
  # is gameType W. An hfGT=R| filter silently drops every postseason game and is
  # the reason the 2026-09-23 staging cache had to be re-validated rather than
  # trusted (see provenance below).
  hfgt_parameter: absent

response:
  status: 200
  content_type: "application/download; charset=utf-8"
  compressed: false          # Savant does not compress this endpoint; the cost is fixed
  encoding: utf-8-sig        # UT-14. The body carries a UTF-8 BOM, bytes EF BB BF
  line_terminator: "\n"      # LF, and the last row has no terminator at all
  ttfb_seconds: 7.0          # measured 2026-09-16
  total_seconds: 7.7         # measured 2026-09-16

header:
  columns: 119
  line_bytes_with_bom: 1825
  # DT-02. The digest and what exactly is hashed are in the committed fixture.
  fixture: tests/fixtures/statcast_header.sha256
  sha256: c1703bd38919ac5304ed7f1e0f3eb225f385b969203db316cde88adc409462e3
  sha256_nobom: 15abe7168e2a5e293574daff1c87b288364e8dcea508a4c52431d9e8fbab269c
  # Byte-identical across every day on disk and identical to the minors CSV.
  # Verified 2026-09-23 over 799 MLB days, seasons 2022 through 2026: one digest.
  names:
    - pitch_type
    - game_date
    - release_speed
    - release_pos_x
    - release_pos_z
    - player_name
    - batter
    - pitcher
    - events
    - description
    - spin_dir
    - spin_rate_deprecated
    - break_angle_deprecated
    - break_length_deprecated
    - zone
    - des
    - game_type
    - stand
    - p_throws
    - home_team
    - away_team
    - type
    - hit_location
    - bb_type
    - balls
    - strikes
    - game_year
    - pfx_x
    - pfx_z
    - plate_x
    - plate_z
    - on_3b
    - on_2b
    - on_1b
    - outs_when_up
    - inning
    - inning_topbot
    - hc_x
    - hc_y
    - tfs_deprecated
    - tfs_zulu_deprecated
    - umpire
    - sv_id
    - vx0
    - vy0
    - vz0
    - ax
    - ay
    - az
    - sz_top
    - sz_bot
    - hit_distance_sc
    - launch_speed
    - launch_angle
    - effective_speed
    - release_spin_rate
    - release_extension
    - game_pk
    - fielder_2
    - fielder_3
    - fielder_4
    - fielder_5
    - fielder_6
    - fielder_7
    - fielder_8
    - fielder_9
    - release_pos_y
    - estimated_ba_using_speedangle
    - estimated_woba_using_speedangle
    - woba_value
    - woba_denom
    - babip_value
    - iso_value
    - launch_speed_angle
    - at_bat_number
    - pitch_number
    - pitch_name
    - home_score
    - away_score
